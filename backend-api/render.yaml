services:
  - type: web
    name: helphive-backend-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # ⚠️  Set this manually in Render → Environment
      - key: JWT_SECRET
        sync: false          # ⚠️  Set this manually in Render → Environment
      - key: CLIENT_URLS
        sync: false          # Comma-separated list of your frontend URLs
      - key: GROQ_API_KEY
        sync: false          # Optional: Groq AI integration
